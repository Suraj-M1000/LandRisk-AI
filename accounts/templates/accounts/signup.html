
{% extends 'projects/base.html' %}

{% block title %}
    LandRisk AI - Sign Up
{% endblock %}

{% block content %}
    <h1>Create an Account</h1>
    <p>Register to manage your LandRisk AI projects.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Sign Up</button>
    </form>

    <p>
        Already have an account?
        <a href="{% url 'login' %}">Log in</a>
    </p>
{% endblock %}
